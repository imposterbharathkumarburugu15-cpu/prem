services:
  - type: web
    name: praman-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: .
    buildCommand: "bash ./build.sh"
    startCommand: "python run.py"
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.10
      - key: PYTHONPATH
        value: .
      - key: DATABASE_URL
        value: sqlite:///./data/praman.db
      - key: SECRET_KEY
        generateValue: true
      - key: STORAGE_DIR
        value: data/evidence
      - key: CORS_ORIGINS
        value: '["*"]'
